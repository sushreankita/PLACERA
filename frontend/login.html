<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PLACERA | Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">

        <!-- LEFT SECTION -->

        <section class="left-section">

            <a href="index.html" class="logo">
                PL<span>A</span>CER<span>A</span>
            </a>

            <div class="left-content">

                <p class="small-heading">
                    WELCOME BACK
                </p>

                <h1>
                    Your Placement<br>
                    <span>Journey Continues.</span>
                </h1>

                <p class="description">
                    Track your applications, analyze your performance
                    and improve your skills with PLACERA.
                </p>

            </div>

        </section>


        <!-- RIGHT SECTION -->

        <section class="right-section">

            <div class="login-card">

                <h2>Welcome Back</h2>

                <p class="subtitle">
                    Login to continue your PLACERA journey.
                </p>


                <!-- TABS -->

                <div class="tabs">

                    <a href="login.html" class="tab active">
                        Login
                    </a>

                    <a href="register.html" class="tab">
                        Register
                    </a>

                </div>


                <!-- LOGIN FORM -->

                <form id="loginForm">

                    <!-- EMAIL -->

                    <div class="input-box">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Email address"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="input-box">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            required
                        >

                    </div>


                    <!-- FORGOT PASSWORD -->

                    <div class="forgot-password">

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- MESSAGE -->

                    <p
                        id="loginMessage"
                        style="
                            display:none;
                            margin:10px 0;
                            font-size:14px;
                        "
                    ></p>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-btn"
                        id="loginButton"
                    >
                        Login →
                    </button>


                    <!-- DIVIDER -->

                    <div class="divider">

                        <span></span>

                        <p>OR</p>

                        <span></span>

                    </div>


                    <!-- GOOGLE -->

                    <button
                        type="button"
                        class="social-btn"
                    >
                        <strong>G</strong>
                        Continue with Google
                    </button>


                    <!-- GITHUB -->

                    <button
                        type="button"
                        class="social-btn"
                    >
                        <strong>◉</strong>
                        Continue with GitHub
                    </button>

                </form>


                <!-- REGISTER -->

                <p class="register-text">

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
