<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PLACERA | Education</title>

    <link rel="stylesheet" href="education.css">
</head>

<body>

    <div class="education-page">

        <div class="education-card">

            <div class="logo">
                PL<span>A</span>CER<span>A</span>
            </div>

            <h1>Education Details</h1>

            <p class="subtitle">
                Add your academic information
            </p>


            <form id="educationForm">

                <!-- COLLEGE -->

                <div class="form-group">

                    <label for="college">
                        College / University
                    </label>

                    <input
                        type="text"
                        id="college"
                        name="college"
                        placeholder="Enter your college name"
                        required
                    >

                </div>


                <!-- DEGREE -->

                <div class="form-group">

                    <label for="degree">
                        Degree
                    </label>

                    <input
                        type="text"
                        id="degree"
                        name="degree"
                        placeholder="e.g. B.Tech"
                        required
                    >

                </div>


                <!-- BRANCH -->

                <div class="form-group">

                    <label for="branch">
                        Branch
                    </label>

                    <input
                        type="text"
                        id="branch"
                        name="branch"
                        placeholder="e.g. Computer Science Engineering"
                        required
                    >

                </div>


                <!-- CURRENT YEAR -->

                <div class="form-group">

                    <label for="currentYear">
                        Current Year
                    </label>

                    <select
                        id="currentYear"
                        name="current_year"
                        required
                    >

                        <option value="">
                            Select Current Year
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>


                <!-- CGPA -->

                <div class="form-group">

                    <label for="cgpa">
                        CGPA
                    </label>

                    <input
                        type="number"
                        id="cgpa"
                        name="cgpa"
                        placeholder="e.g. 8.05"
                        min="0"
                        max="10"
                        step="0.01"
                        required
                    >

                </div>


                <!-- GRADUATION YEAR -->

                <div class="form-group">

                    <label for="graduationYear">
                        Graduation Year
                    </label>

                    <input
                        type="number"
                        id="graduationYear"
                        name="graduation_year"
                        placeholder="e.g. 2026"
                        min="2020"
                        max="2100"
                        required
                    >

                </div>


                <!-- MESSAGE -->

                <p
                    id="educationMessage"
                    style="
                        display:none;
                        font-size:14px;
                        margin:10px 0;
                    "
                ></p>


                <!-- BUTTON -->

                <button
                    type="submit"
                    id="educationButton"
                >
                    Continue →
                </button>

            </form>

        </div>

    </div>


    <script src="education.js"></script>

</body>

</html>
